name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
# Deux valeurs sont calculées au build et se périmeraient sans nouveau
# déploiement : la durée d'expérience (bascule le 1er octobre) et l'année du
# copyright en pied de page (1er janvier). On couvre donc les deux dates.
  schedule:
    - cron: '0 4 1 1,10 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      # Liens internes uniquement : l'indisponibilité d'un site externe
      # (rate-limiting des IP de CI, lien mort chez un tiers) ne doit pas
      # bloquer un déploiement.
      - name: Vérification des liens internes
        run: npx linkinator@6 ./dist --recurse --silent --skip "^https?://(?!localhost)"
      # Sans cette option, l'action exclut les fichiers cachés : le .htaccess
      # qui porte les en-têtes de cache n'arriverait jamais jusqu'au déploiement.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Le serveur FTP mutualisé met parfois plusieurs dizaines de secondes à
      # ouvrir la socket de contrôle : 30 s par défaut ne suffisent pas, et une
      # seconde tentative rattrape les coupures franches.
      - name: Déploiement FTP Hostinger
        id: deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 120000

      - name: Déploiement FTP Hostinger (seconde tentative)
        if: steps.deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 120000
