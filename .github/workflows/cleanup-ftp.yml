name: Nettoyage FTP (ponctuel)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y && npm install basic-ftp
      - name: Lister puis supprimer les dossiers parasites
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          cat > cleanup.mjs <<'EOF'
          import { Client } from 'basic-ftp';

          // Copies laissées par deux tentatives de déploiement avec un
          // server-dir erroné. Le site réel est à la racine du compte FTP.
          const STRAY_DIRS = ['home', 'domains'];

          const client = new Client();
          try {
            await client.access({
              host: process.env.FTP_SERVER,
              user: process.env.FTP_USERNAME,
              password: process.env.FTP_PASSWORD,
              secure: true,
              // Le certificat Hostinger ne couvre que *.hstgr.io alors que la
              // connexion se fait sur un autre nom d'hôte ; la session reste
              // chiffrée, seule la validation du nom est relâchée (même
              // comportement que l'action de déploiement).
              secureOptions: { rejectUnauthorized: false },
            });

            const before = await client.list('/');
            console.log('Contenu de la racine avant nettoyage :');
            for (const f of before) console.log(`  ${f.isDirectory ? 'd' : '-'} ${f.name}`);

            for (const dir of STRAY_DIRS) {
              if (!before.some((f) => f.name === dir && f.isDirectory)) {
                console.log(`Ignoré : "${dir}" absent`);
                continue;
              }
              console.log(`Suppression récursive de "${dir}"...`);
              await client.removeDir(`/${dir}`);
              console.log(`  supprimé`);
            }

            const after = await client.list('/');
            console.log('Contenu de la racine après nettoyage :');
            for (const f of after) console.log(`  ${f.isDirectory ? 'd' : '-'} ${f.name}`);
          } finally {
            client.close();
          }
          EOF
          node cleanup.mjs
